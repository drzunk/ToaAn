<!DOCTYPE html>
<!-- WF-{{NNNN}} | Pattern: detail -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.344.0/umd/lucide.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

  <main class="max-w-4xl mx-auto p-6">

    <!-- Header -->
    <div class="flex justify-between items-start mb-6">
      <div>
        <button class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-gray-900 mb-2">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
          Back
        </button>
        <h1 class="text-2xl font-bold">{{TITLE}}</h1>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-sm text-gray-500">{{ENTITY_ID}}</span>
          <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-green-100 text-green-800">
            {{STATUS}}
          </span>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="inline-flex items-center gap-2 px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-md font-medium hover:bg-gray-50">
          <i data-lucide="pencil" class="w-4 h-4"></i>
          Edit
        </button>
        <button class="inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-md font-medium hover:bg-red-700">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          Delete
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="border-b border-gray-200 mb-6">
      <nav class="-mb-px flex gap-6">
        <button class="border-b-2 border-blue-600 px-1 py-3 text-sm font-medium text-blue-600">Tổng quan</button>
        <button class="border-b-2 border-transparent px-1 py-3 text-sm font-medium text-gray-600 hover:border-gray-300">Lịch sử</button>
        <button class="border-b-2 border-transparent px-1 py-3 text-sm font-medium text-gray-600 hover:border-gray-300">Tài liệu</button>
        <button class="border-b-2 border-transparent px-1 py-3 text-sm font-medium text-gray-600 hover:border-gray-300">Audit log</button>
      </nav>
    </div>

    <!-- Field grid (read-only display) -->
    <div class="bg-white rounded-lg border border-gray-200 p-6 mb-4">
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4">Thông tin chung</h2>
      <dl class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <dt class="text-sm text-gray-500">{{FIELD_1_LABEL}}</dt>
          <dd class="text-sm font-medium mt-1">{{FIELD_1_VALUE}}</dd>
        </div>
        <div>
          <dt class="text-sm text-gray-500">{{FIELD_2_LABEL}}</dt>
          <dd class="text-sm font-medium mt-1">{{FIELD_2_VALUE}}</dd>
        </div>
        <div>
          <dt class="text-sm text-gray-500">{{FIELD_3_LABEL}}</dt>
          <dd class="text-sm font-medium mt-1">{{FIELD_3_VALUE}}</dd>
        </div>
        <div>
          <dt class="text-sm text-gray-500">{{FIELD_4_LABEL}}</dt>
          <dd class="text-sm font-medium mt-1">{{FIELD_4_VALUE}}</dd>
        </div>
      </dl>
    </div>

    <!-- Related items list -->
    <div class="bg-white rounded-lg border border-gray-200 p-6">
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4">Related items</h2>
      <ul class="divide-y divide-gray-200">
        <li class="py-3 flex justify-between items-center">
          <div>
            <p class="font-medium">Item 1</p>
            <p class="text-sm text-gray-500">Description</p>
          </div>
          <button class="text-blue-600 text-sm hover:underline">View →</button>
        </li>
        <!-- Repeat -->
      </ul>
    </div>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
