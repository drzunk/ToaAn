<!DOCTYPE html>
<!-- WF-{{NNNN}} | Pattern: modal (inline với background) -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.344.0/umd/lucide.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

  <!-- Background page (dimmed) -->
  <main class="max-w-4xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4 text-gray-400">Background page</h1>
    <p class="text-gray-400">(rest of page dimmed when modal open)</p>
  </main>

  <!-- Modal overlay -->
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-gray-200 p-6">
        <div>
          <h2 class="text-lg font-semibold">{{MODAL_TITLE}}</h2>
          <p class="text-sm text-gray-500 mt-1">{{MODAL_DESCRIPTION}}</p>
        </div>
        <button class="p-1 rounded hover:bg-gray-100" aria-label="Close">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Body -->
      <div class="p-6 space-y-4">
        <!-- Confirmation pattern -->
        <div class="rounded-lg border border-yellow-200 bg-yellow-50 p-3">
          <div class="flex gap-2">
            <i data-lucide="alert-triangle" class="w-5 h-5 mt-0.5 text-yellow-600"></i>
            <div>
              <p class="text-sm font-medium text-yellow-900">{{WARNING_TITLE}}</p>
              <p class="text-sm text-yellow-700 mt-1">{{WARNING_BODY}}</p>
            </div>
          </div>
        </div>

        <!-- Optional input (mini form) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">{{FIELD_LABEL}}</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-2 border-t border-gray-200 p-4 bg-gray-50 rounded-b-lg">
        <button class="px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-md font-medium hover:bg-gray-50">
          {{ACTION_CANCEL}}
        </button>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
          {{ACTION_CONFIRM}}
        </button>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
