<!DOCTYPE html>
<!--
  WF-{{NNNN}} | Pattern: form
  Generated by /fis-wireframe html
  Design config: docs/design/design.md
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.344.0/umd/lucide.min.js"></script>
  <script>
    // Inject from design.md (auto-replaced by skill)
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '{{DESIGN.colors.primary | "#2563eb"}}',
            'primary-hover': '{{DESIGN.colors.primary_hover | "#1d4ed8"}}',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

  <!-- Breadcrumb -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3">
    <ol class="flex items-center space-x-2 text-sm text-gray-600">
      <li><a href="#" class="hover:text-gray-900">{{BREADCRUMB_HOME}}</a></li>
      <li><span class="text-gray-400">/</span></li>
      <li><a href="#" class="hover:text-gray-900">{{BREADCRUMB_PARENT}}</a></li>
      <li><span class="text-gray-400">/</span></li>
      <li class="text-gray-900 font-medium">{{TITLE}}</li>
    </ol>
  </nav>

  <main class="max-w-2xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">{{TITLE}}</h1>

    <form class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-4">

      <!-- Section: General -->
      <div class="space-y-4">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">{{SECTION_1_TITLE}}</h2>

        <!-- Field A: Text -->
        <div>
          <label for="fieldA" class="block text-sm font-medium text-gray-700 mb-1">
            {{FIELD_A_LABEL}} <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="fieldA"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="{{FIELD_A_PLACEHOLDER}}"
          />
          <p class="mt-1 text-xs text-gray-500">{{FIELD_A_HINT}}</p>
        </div>

        <!-- Field B: Number -->
        <div>
          <label for="fieldB" class="block text-sm font-medium text-gray-700 mb-1">
            {{FIELD_B_LABEL}} <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            id="fieldB"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="0"
          />
        </div>

        <!-- Field C: Select -->
        <div>
          <label for="fieldC" class="block text-sm font-medium text-gray-700 mb-1">
            {{FIELD_C_LABEL}}
          </label>
          <select
            id="fieldC"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">-- Chọn --</option>
            <option value="opt1">{{FIELD_C_OPT_1}}</option>
            <option value="opt2">{{FIELD_C_OPT_2}}</option>
          </select>
        </div>

        <!-- Field D: Textarea -->
        <div>
          <label for="fieldD" class="block text-sm font-medium text-gray-700 mb-1">
            {{FIELD_D_LABEL}}
          </label>
          <textarea
            id="fieldD"
            rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="{{FIELD_D_PLACEHOLDER}}"
          ></textarea>
        </div>

        <!-- Field E: Checkbox -->
        <div>
          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            <span class="text-sm text-gray-700">{{FIELD_E_LABEL}}</span>
          </label>
        </div>
      </div>

      <!-- Alert -->
      <div class="rounded-lg border border-yellow-200 bg-yellow-50 p-3 text-yellow-900">
        <div class="flex gap-2">
          <i data-lucide="alert-triangle" class="w-4 h-4 mt-0.5 text-yellow-600"></i>
          <p class="text-sm">{{ALERT_MESSAGE}}</p>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button
          type="button"
          class="px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-md font-medium hover:bg-gray-50"
        >
          {{ACTION_CANCEL}}
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          {{ACTION_SUBMIT}}
        </button>
      </div>

    </form>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
