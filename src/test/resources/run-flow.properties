################################################################################
#  BẢNG ĐIỀU KHIỂN — ưu tiên dùng menu: .\scripts\chay.cmd
################################################################################

# smoke | mid | full | master | login | le
# (master = chạy theo danh sách case ở run.caseSource — sheet hoặc run.cases)
# (le = chạy lẻ vài case tick trong sheet — case ra mã TC_LE_xxx thay vì TC_FULL_xxx)
run.suite=master

# Số Chrome mở cùng lúc (có thể ÍT hơn số case trong run.cases)
run.browsers=1
run.parallel=false

# Độ sâu chung (khi KHÔNG dùng run.cases)
run.untilStep=6
run.submit=false

# ---- Nguồn test case ---------------------------------------------------------
# sheet = đọc từ Google Sheet dưới đây (mặc định khi run.casesSheet khác rỗng)
# file  = đọc run.casesFile (json, nếu có đặt) — không thì đọc run.cases bên dưới
run.caseSource=file

# Google Sheet chứa danh sách case — phải chia sẻ "Bất kỳ ai có đường liên kết — Người xem".
# Cột (dòng đầu, không cần đúng thứ tự): Chạy | Loại đơn | Loại việc | Chủ thể | Tư cách
#   | Tòa án | Số bị đơn | Đồng NĐ | Đại diện | Liên quan | TL bổ sung | Đến bước | Gửi đơn | Ghi chú
# Ô trống ở cột nhánh = để automation tự chọn. Chi tiết: README mục 6.4.
run.casesSheet=https://docs.google.com/spreadsheets/d/1ClZ9FJXn9lrCqxqTsTDoP5wlA7ajFQ7o0yyfL1J2KJU/edit?usp=sharing
# Tab cụ thể (gid trên URL). Để trống = tab đầu tiên.
run.casesSheetGid=

# File JSON khai báo case cục bộ (git-tracked) — sửa qua Dashboard web (menu 9 trong
# ".\scripts\chay.cmd", hoặc "mvn exec:java") thay vì Google Sheet. Chỉ dùng khi
# run.caseSource=file. Validate nghiêm ngay lúc nạp (Loại đơn/Loại việc/Tòa án/Chủ thể sai
# chính tả bị chặn, không âm thầm bỏ qua như sheet).
run.casesFile=src/test/resources/local-cases.json

# Case tùy chọn từ menu 1 — dùng khi run.caseSource=file VÀ run.casesFile để trống
# (hoặc sheet lỗi và chưa có cache)
# Format: Loại đơn>Loại việc>CN|TC>tư cách|->until[:submit]
# Nhiều case ngăn bởi | — số Chrome lấy từ run.browsers (không bắt buộc = số case)
# Ví dụ 2 Chrome + 4 case: run.browsers=2 và 4 đoạn nối bằng |
run.cases=

# Legacy (hiếm dùng) — để trống
run.slots=

# width/height = 0 -> tự chia đều màn hình theo số Chrome (2-3 cửa sổ) rồi co theo run.window.scale.
# Đặt > 200px nếu muốn ép kích thước cố định thay vì tự căn đều.
run.window.width=0
run.window.height=0
run.window.scale=0.94
run.openReport=true

# So thu muc luot chay giu lai trong test-output/runs/ — cu hon thi xoa sau moi lan chay.
# Do that: FULL ~36 MB/luot, MID ~13 MB, SMOKE ~1.4 MB. Chay FULL hang ngay ~1 GB/thang.
# Dat 0 de KHONG BAO GIO xoa gi.
run.keepRuns=30
run.requireSubmit=true
