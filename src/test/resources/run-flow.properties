################################################################################
#  BẢNG ĐIỀU KHIỂN — ưu tiên dùng menu: .\scripts\chay.cmd
################################################################################

# smoke | mid | full | master | login
run.suite=master

# Số Chrome mở cùng lúc (có thể ÍT hơn số case trong run.cases)
run.browsers=3
run.parallel=true

# Độ sâu chung (khi KHÔNG dùng run.cases)
run.untilStep=6
run.submit=false

# Case tùy chọn từ menu 1 — để trống khi chạy smoke/mid/full
# Format: Loại đơn>Loại việc>CN|TC>tư cách|->until[:submit]
# Nhiều case ngăn bởi | — số Chrome lấy từ run.browsers (không bắt buộc = số case)
# Ví dụ 2 Chrome + 4 case: run.browsers=2 và 4 đoạn nối bằng |
run.cases=Dân sự>Bồi thường thiệt hại ngoài hợp đồng>TC>->6:submit|Dân sự>Hợp đồng dân sự>CN>->6:submit|Dân sự>Bồi thường thiệt hại ngoài hợp đồng>TC>->6:submit|Dân sự>Vay tài sản>CN>->6:submit|Dân sự>Đất đai – nhà ở>TC>->6:submit|Dân sự>Khác>TC>->6:submit|Phá sản>Yêu cầu mở thủ tục phá sản>TC>Chủ nợ>6:submit|Hôn nhân và gia đình>Ly hôn đơn phương>TC>->6:submit

# Legacy (hiếm dùng) — để trống
run.slots=

run.window.width=520
run.window.height=580
run.window.scale=0.55
run.openReport=true
run.requireSubmit=true
