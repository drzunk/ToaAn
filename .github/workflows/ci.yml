name: CI unit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Chạy smoke UI (cần secrets TOAAN_* + Chrome) — mặc định tắt"
        type: boolean
        default: false

jobs:
  unit:
    name: mvn -Punit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests (no Chrome)
        run: mvn -B -Punit test

      - name: Upload test-output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-unit
          path: test-output/
          if-no-files-found: ignore

  smoke:
    name: smoke (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke == true
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Require credentials
        env:
          TOAAN_USERNAME: ${{ secrets.TOAAN_USERNAME }}
          TOAAN_PASSWORD: ${{ secrets.TOAAN_PASSWORD }}
          TOAAN_BASE_URL: ${{ secrets.TOAAN_BASE_URL }}
        run: |
          if [ -z "$TOAAN_USERNAME" ] || [ -z "$TOAAN_PASSWORD" ] || [ -z "$TOAAN_BASE_URL" ]; then
            echo "Thiếu secrets TOAAN_USERNAME / TOAAN_PASSWORD / TOAAN_BASE_URL — bỏ qua smoke."
            exit 1
          fi

      - name: Smoke UI
        env:
          TOAAN_USERNAME: ${{ secrets.TOAAN_USERNAME }}
          TOAAN_PASSWORD: ${{ secrets.TOAAN_PASSWORD }}
          TOAAN_BASE_URL: ${{ secrets.TOAAN_BASE_URL }}
        run: mvn -B -Psmoke test

      - name: Upload test-output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-smoke
          path: test-output/
          if-no-files-found: ignore
